<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validations CrossFit</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--card:#171b24;--line:#2a3040;--acc:#ff5a1f;--ok:#22c55e;--tx:#f1f3f7;--mut:#8b93a7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;font-weight:600}
h1,h2,.big{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:1.5px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:2px solid var(--acc)}
h1{font-size:34px}h1 span{color:var(--acc)}
.badge{font-size:17px;padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.badge.ok{color:var(--ok)}.badge.wait{color:#fbbf24}
nav{display:flex;gap:10px;padding:12px 20px 0}
.tab{flex:1;padding:12px;font:inherit;font-size:22px;color:var(--mut);background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--acc)}
main{padding:14px 20px 30px;max-width:1100px;margin:auto}
.grid{display:grid;gap:14px}
@media(min-width:800px){.grid{grid-template-columns:1fr 1.6fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:24px;color:var(--acc);margin:0 0 8px}
label{display:block;color:var(--mut);margin:12px 0 4px;font-size:18px}
input,select{width:100%;padding:12px;font:inherit;font-size:22px;color:var(--tx);background:var(--bg);border:2px solid var(--line);border-radius:10px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.tile{flex:1 1 130px;padding:14px 10px;font:inherit;font-size:21px;color:var(--tx);background:var(--bg);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.tile.on{border-color:var(--acc);background:#2a1a12}
.lvl{flex:1 1 70px;font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;font-weight:400}
.hide{display:none}
.save{width:100%;margin-top:14px;padding:16px;font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:2px;color:#fff;background:var(--acc);border:0;border-radius:12px;cursor:pointer}
.save.s{width:auto;margin:0;padding:10px 24px;font-size:26px}
.row{display:flex;gap:10px;align-items:end}.row>div{flex:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:14px 26px;border-radius:12px;background:var(--ok);color:#04210f;font-size:21px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}#toast.err{background:#ef4444;color:#fff}
.fam{margin-top:16px}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex .nm{flex:1 1 40%}.ex small{display:block;color:var(--mut);font-size:16px;font-weight:500}
.chips{display:flex;gap:6px}
.chip{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--mut)}
.chip.f{background:var(--ok);border-color:var(--ok);color:#04210f}
.none{opacity:.45}
.prog{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<header><h1>CROSSFIT <span>· VALIDATIONS</span></h1><span id="sync" class="badge"></span></header>
<nav><button class="tab on" id="t1">Valider un niveau</button><button class="tab" id="t2">Mes validations</button></nav>
<main>

<section id="v1">
 <div class="grid">
  <div class="card">
   <h2>Qui es-tu ?</h2>
   <label for="pseudo">Ton pseudo</label><input id="pseudo" autocomplete="off" autocapitalize="off">
   <label for="classe">Ta classe</label><select id="classe"></select>
   <label for="valid">Pseudo de l'élève qui valide</label><input id="valid" autocomplete="off" autocapitalize="off">
  </div>
  <div class="card">
   <h2>Ce que tu as réussi</h2>
   <label>Famille</label><div class="tiles" id="fams"></div>
   <div id="exBox" class="hide"><label>Exercice</label><div class="tiles" id="exs"></div></div>
   <div id="lvBox" class="hide"><label id="lvLabel">Niveau validé</label><div class="tiles" id="lvs"></div></div>
  </div>
 </div>
 <button class="save" id="save">ENREGISTRER</button>
</section>

<section id="v2" class="hide">
 <div class="card">
  <h2>Retrouve tes validations</h2>
  <div class="row">
   <div><label for="sPseudo">Ton pseudo</label><input id="sPseudo" autocomplete="off" autocapitalize="off"></div>
   <div><label for="sClasse">Ta classe</label><select id="sClasse"></select></div>
   <button class="save s" id="search">CHERCHER</button>
  </div>
 </div>
 <div id="res"></div>
</section>

</main>
<div id="toast"></div>

<script>
// ▼▼ Colle ici l'URL de déploiement Apps Script (se termine par /exec) ▼▼
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcGkPYXYxPSq8ukDZAI6qVlHnCywQRJ40cUYrlpppXZ4UyuVok12hL40Ag10mLN-Rw/exec";

const FAMILLES = {
  "Explosivité": ["Fente avant", "Squat", "Box jump"],
  "Force": ["Pompes", "Dips", "Med ball sto"],
  "Cardio": ["Burpee", "Jumping jack", "Corde à sauter", "Mountain climber"],
  "Résistance": ["Abdos med ball", "Gainage", "Chaise"]
};
const CLASSES = ["5A","5B","5C","5D","5E","3A","3B","3C","3D","3E"];
const NB_EX = Object.values(FAMILLES).reduce((a, l) => a + l.length, 0);
const $ = id => document.getElementById(id);
const nbNiveaux = c => (c && c[0] === "3") ? 4 : 3;
const S = { famille: "", exercice: "", niveau: 0 };

function h(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "show" + (err ? " err" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 2600); }

/* ---------- Onglets ---------- */
function tab(n) {
  $("v1").classList.toggle("hide", n !== 1); $("v2").classList.toggle("hide", n !== 2);
  $("t1").classList.toggle("on", n === 1); $("t2").classList.toggle("on", n === 2);
}
$("t1").onclick = () => tab(1);
$("t2").onclick = () => { $("sPseudo").value = $("sPseudo").value || $("pseudo").value; tab(2); };

/* ---------- Formulaire ---------- */
function fillClasses() {
  CLASSES.forEach(c => { $("classe").append(new Option(c, c)); $("sClasse").append(new Option(c, c)); });
  $("classe").insertBefore(new Option("— choisir —", ""), $("classe").firstChild);
  $("sClasse").insertBefore(new Option("Toutes", ""), $("sClasse").firstChild);
  const p = load("cf_id", {});
  $("pseudo").value = p.pseudo || ""; $("classe").value = p.classe || "";
  $("sPseudo").value = p.pseudo || ""; $("sClasse").value = p.classe || "";
}
function tiles(box, items, cls, current, onPick) {
  box.innerHTML = "";
  items.forEach(it => {
    const b = h("button", "tile " + (cls || "") + (it.v === current ? " on" : ""), it.t);
    b.onclick = () => onPick(it.v); box.append(b);
  });
}
function drawFam() { tiles($("fams"), Object.keys(FAMILLES).map(f => ({ v: f, t: f })), "", S.famille, f => { S.famille = f; S.exercice = ""; S.niveau = 0; drawAll(); }); }
function drawEx() {
  $("exBox").classList.toggle("hide", !S.famille); if (!S.famille) return;
  tiles($("exs"), FAMILLES[S.famille].map(e => ({ v: e, t: e })), "", S.exercice, e => { S.exercice = e; S.niveau = 0; drawAll(); });
}
function drawLv() {
  $("lvBox").classList.toggle("hide", !S.exercice); if (!S.exercice) return;
  const c = $("classe").value, n = nbNiveaux(c);
  $("lvLabel").textContent = c ? "Niveau validé (" + n + " niveaux en " + c + ")" : "Niveau validé (choisis d'abord ta classe)";
  tiles($("lvs"), Array.from({ length: n }, (_, i) => ({ v: i + 1, t: String(i + 1) })), "lvl", S.niveau, v => { S.niveau = v; drawAll(); });
}
function drawAll() { drawFam(); drawEx(); drawLv(); }
$("classe").onchange = () => { S.niveau = 0; drawLv(); };

/* ---------- File d'attente + envoi (local-first) ---------- */
let busy = false;
function queue() { return load("cf_queue", []); }
function badge() {
  const n = queue().length, b = $("sync");
  if (!SCRIPT_URL) { b.className = "badge wait"; b.textContent = "⚠ URL du script manquante"; return; }
  b.className = "badge " + (n ? "wait" : "ok");
  b.textContent = n ? "⏳ " + n + " en attente" : "✔ tout est envoyé";
}
async function flush() {
  if (busy || !SCRIPT_URL) { badge(); return; }
  busy = true;
  try {
    let q = queue();
    while (q.length) {
      await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(q[0]) });
      q = queue().filter(x => x.id !== q[0].id); store("cf_queue", q); badge();
    }
  } catch (e) { /* hors-ligne : on réessaiera */ }
  busy = false; badge();
}
$("save").onclick = () => {
  const pseudo = $("pseudo").value.trim(), classe = $("classe").value, val = $("valid").value.trim();
  if (!pseudo || !classe) return toast("Indique ton pseudo et ta classe", true);
  if (!S.famille || !S.exercice || !S.niveau) return toast("Choisis la famille, l'exercice et le niveau", true);
  if (!val) return toast("Indique le pseudo de l'élève qui valide", true);
  if (val.toLowerCase() === pseudo.toLowerCase()) return toast("Tu ne peux pas te valider toi-même", true);
  const q = queue();
  q.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 6), pseudo, classe, famille: S.famille, exercice: S.exercice, niveau: S.niveau, validateur: val });
  store("cf_queue", q); store("cf_id", { pseudo, classe });
  toast("Niveau " + S.niveau + " enregistré : " + S.exercice);
  S.famille = ""; S.exercice = ""; S.niveau = 0; $("valid").value = ""; drawAll(); badge(); flush();
};
window.addEventListener("online", flush);

/* ---------- Consultation (JSONP vers Apps Script) ---------- */
function jsonp(params, ok, ko) {
  const cb = "cb" + Date.now(), s = document.createElement("script"); let done = false;
  const clean = () => { clearTimeout(t); delete window[cb]; s.remove(); };
  const t = setTimeout(() => { if (!done) { done = true; clean(); ko(); } }, 12000);
  window[cb] = d => { if (!done) { done = true; clean(); ok(d); } };
  s.onerror = () => { if (!done) { done = true; clean(); ko(); } };
  s.src = SCRIPT_URL + "?" + new URLSearchParams(Object.assign({}, params, { callback: cb }));
  document.head.appendChild(s);
}
$("search").onclick = () => {
  const p = $("sPseudo").value.trim(), c = $("sClasse").value, box = $("res");
  if (!p) return toast("Saisis ton pseudo", true);
  if (!SCRIPT_URL) return toast("URL du script non renseignée", true);
  box.innerHTML = ""; box.append(h("p", "", "Recherche en cours…"));
  jsonp({ action: "search", pseudo: p, classe: c }, d => render(d, p, c), () => { box.innerHTML = ""; toast("Connexion impossible, réessaie", true); });
};
function render(d, pseudo, classe) {
  const box = $("res"); box.innerHTML = "";
  if (!d || !d.ok) return box.append(h("p", "", "Erreur : " + ((d && d.erreur) || "réponse invalide")));
  if (!d.rows.length) return box.append(h("div", "card", "Aucune validation trouvée pour « " + pseudo + " »" + (classe ? " en " + classe : "") + ". Vérifie ton pseudo ou ta classe."));
  const cl = classe || d.rows[d.rows.length - 1].classe, n = nbNiveaux(cl);
  const best = {}; d.rows.forEach(r => { (best[r.famille + "|" + r.exercice] = best[r.famille + "|" + r.exercice] || []).push(r); });
  const faits = Object.keys(best).length;
  const top = h("div", "card");
  top.append(h("h2", "", pseudo + " · " + cl));
  top.append(h("div", "big", faits + " / " + NB_EX + " exercices validés"));
  const pr = h("div", "prog"), bar = h("i"); bar.style.width = Math.round(100 * faits / NB_EX) + "%"; pr.append(bar); top.append(pr);
  box.append(top);
  Object.keys(FAMILLES).forEach(f => {
    const c = h("div", "card fam"); c.append(h("h2", "", f));
    FAMILLES[f].forEach(e => {
      const rows = (best[f + "|" + e] || []).slice().sort((a, b) => a.niveau - b.niveau);
      const mx = rows.length ? Math.max.apply(null, rows.map(r => r.niveau)) : 0;
      const line = h("div", "ex" + (mx ? "" : " none")), nm = h("div", "nm", e);
      nm.append(h("small", "", mx ? rows.map(r => "N" + r.niveau + " le " + r.date + " (par " + r.validateur + ")").join(" · ") : "pas encore validé"));
      const ch = h("div", "chips");
      for (let i = 1; i <= n; i++) ch.append(h("div", "chip" + (i <= mx ? " f" : ""), String(i)));
      line.append(nm, ch); c.append(line);
    });
    box.append(c);
  });
}
$("sPseudo").addEventListener("keydown", e => { if (e.key === "Enter") $("search").click(); });

fillClasses(); drawAll(); badge(); flush();
</script>
</body>
</html>
